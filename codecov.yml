codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: '70...100'

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error

    patch:
      default:
        target: 70%
        threshold: 5%

flags:
  backend:
    paths:
      - apps/api/src/
    carryforward: true

  frontend:
    paths:
      - apps/web/src/
    carryforward: true

comment:
  layout: 'reach,diff,flags,tree'
  behavior: default
  require_changes: false

ignore:
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/dist/**'
  - '**/.next/**'
  - '**/node_modules/**'
  - '**/coverage/**'
